name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  orbityard:
    name: orbityard test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          cache-targets: "true"
      - name: Test orbityard
        run: cargo test -p orbityard --locked
      - name: CLI smoke
        run: |
          cargo build -p orbityard --release --locked
          ./target/release/orbityard --help
          ./target/release/orbityard doctor --project .
          ./target/release/orbityard guide --project .
          ./target/release/orbityard vault --help
