name: Desktop

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "crates/orbityard/**"
      - "scripts/stage-desktop.sh"
      - "scripts/ensure-orbityard-resource.sh"
      - ".github/workflows/desktop.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "crates/orbityard/**"
      - "scripts/stage-desktop.sh"
      - "scripts/ensure-orbityard-resource.sh"
      - ".github/workflows/desktop.yml"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."
          cache-targets: "true"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Linux WebKit / GTK deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Install JS deps (workspace)
        run: pnpm install --filter orbit-yard-desktop...

      - name: Stage + tauri build (installers)
        shell: bash
        run: bash scripts/stage-desktop.sh --installer

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: orbit-yard-desktop-${{ matrix.os }}
          path: |
            target/release/bundle/nsis/*
            target/release/bundle/dmg/*
            target/release/bundle/macos/*
            target/release/bundle/deb/*
            target/release/bundle/appimage/*
          if-no-files-found: warn
          retention-days: 14
