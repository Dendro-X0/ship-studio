<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Harbor</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0c100e;
        --text: #e6efe9;
        --muted: #8fa398;
        --accent: #5ecf94;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Segoe UI", system-ui, sans-serif;
        color: var(--text);
        background:
          radial-gradient(80% 60% at 10% 0%, rgba(94, 207, 148, 0.14), transparent 55%),
          var(--bg);
        display: grid;
        place-items: center;
        padding: 2rem;
      }
      main {
        max-width: 28rem;
      }
      p.kicker {
        margin: 0 0 0.5rem;
        font-size: 0.72rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--accent);
      }
      h1 {
        margin: 0 0 0.65rem;
        font-size: 2.1rem;
        letter-spacing: -0.03em;
        font-weight: 650;
      }
      p.lede {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">Sample project</p>
      <h1>Harbor</h1>
      <p class="lede">
        Lightweight Desktop + Docs fixture for Ship Studio demos. Not a shipping product — a stage
        set for bind → detect → Publish.
      </p>
    </main>
  </body>
</html>
