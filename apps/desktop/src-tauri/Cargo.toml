[package]
name = "ship-studio-desktop"
version = "0.2.2"
description = "Ship Studio — local Signet+Orbit bridge shell"
authors = ["Dendro-X0"]
edition = "2021"

[lib]
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
which = "7"
