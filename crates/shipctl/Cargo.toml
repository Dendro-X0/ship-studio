[package]
name = "shipctl"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local Ship bridge: configure → Signet → Orbit (CLI + MCP)"

[[bin]]
name = "shipctl"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
argon2 = "0.5"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
rand = "0.8"
ratatui = "0.29"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3.55", default-features = false, features = ["formatting", "local-offset", "std"] }
which = "7"
zeroize = "1"
